[project]
name = "rita"
version = "0.20.1"
description = "RITA — Routing, Iteration, Testing, Automation: a deterministic orchestrator with a speech front end for Zephyr firmware work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Optional feature groups — install only what your machine/use-case needs.
# The core runs with ZERO heavy deps (mock providers) so it works headless.
[project.optional-dependencies]
gpu = ["torch"]                       # CUDA/Metal model acceleration
local-llm = ["ollama"]                # local model serving
perception = ["mss", "pillow", "rapidocr-onnxruntime"]
business = ["python-pptx", "python-docx", "openpyxl", "msal", "requests"]
secrets = ["keyring"]
voice = ["faster-whisper", "sounddevice", "pyttsx3"]
control = ["pyautogui", "pynput", "pyperclip", "pygetwindow"]
windows = ["pywinauto", "uiautomation"]
dev = ["pytest"]
firmware = ["pyyaml"]                 # full YAML for workspace metadata (subset parser is built in)
mcp = ["mcp"]                         # the workspace MCP server (rita mcp-serve)
gui = ["PySide6-Essentials"]          # the native Qt app (rita-app)

[project.scripts]
rita = "rita.__main__:main"
# Deprecated alias for one release; remove in 0.9.
aica = "rita.__main__:main"

[project.gui-scripts]
rita-app = "rita.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rita = ["firmware/data/*.json", "firmware/data/knowledge/*"]
