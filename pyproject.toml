[project]
name = "aica"
version = "0.1.0"
description = "A local-first, modular AI computer assistant (sees the screen, controls the PC, helps you code and do business work)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Optional feature groups — install only what your machine/use-case needs.
# The core runs with ZERO heavy deps (mock providers) so it works headless.
[project.optional-dependencies]
gpu = ["torch"]                       # CUDA/Metal model acceleration
local-llm = ["ollama"]                # local model serving
cloud = ["anthropic"]                 # Claude escalation
perception = ["mss", "pillow", "rapidocr-onnxruntime"]
business = ["python-pptx", "python-docx", "openpyxl", "msal", "requests"]
control = ["pyautogui", "pynput", "pyperclip", "pygetwindow"]
windows = ["pywinauto", "uiautomation"]
dev = ["pytest"]

[project.scripts]
aica = "aica.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
